<!DOCTYPE html>
<!-- Turning on native dark mode fixes the muddy colors instantly -->
<html lang="en" data-bs-theme="dark"> 
<head>
    <title>Test Matrix Logger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sleek, deep background instead of the standard gray */
        body {
            background-color: #0d1117; 
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Glassy, modern card style */
        .glass-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        /* Crisper labels */
        .form-label {
            font-weight: 500;
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }
        /* Subtle input borders */
        .form-control, .form-select {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25);
            color: #ffffff;
        }
        /* Modern button */
        .btn-brand {
            background-color: #238636;
            color: white;
            border: 1px solid rgba(240, 246, 252, 0.1);
            font-weight: 600;
        }
        .btn-brand:hover {
            background-color: #2ea043;
            color: white;
        }
    </style>
</head>
<body class="p-4 p-md-5">
    <div class="container" style="max-width: 650px;">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-white">
                <span style="color: #58a6ff;">⚡</span> Test Matrix
            </h3>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Back to dashboard</a>
        </div>

        <!-- Success/Error Alerts -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-0" style="background-color: #1f6feb20; color: #58a6ff; border-left: 4px solid #58a6ff !important;" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close filter-light" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form Card -->
        <div class="card glass-card">
            <div class="card-body p-4 p-md-5">
                <form action="{% url 'test_matrix' %}" method="POST">
                    {% csrf_token %}
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Tester Name</label>
                            <select name="tester_name" class="form-select" required>
                                <option value="" disabled selected>Select Tester...</option>
                                <option value="Shourya">Shourya</option>
                                <option value="Samiksha">Samiksha</option>
                                <option value="Lovely">Lovely</option>
                                <option value="Iqtadar">Iqtadar</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Dataset Name</label>
                            <input type="text" name="dataset_name" class="form-control" placeholder="e.g., diabetes.csv" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Dataset Link (Optional)</label>
                        <input type="url" name="dataset_link" class="form-control" placeholder="https://kaggle.com/...">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Exact Prompt Tested</label>
                        <input type="text" name="prompt" class="form-control" placeholder="What did you type into the copilot?" required>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Tool Routed</label>
                            <select name="tool_routed" class="form-select" required>
                                <option value="drop_column">drop_column</option>
                                <option value="rename_column">rename_column</option>
                                <option value="duplicate_column">duplicate_column</option>
                                <option value="Hallucinated">None / Hallucinated</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Execution Result</label>
                            <select name="is_success" class="form-select" required>
                                <option value="True"> Success</option>
                                <option value="False"> Failed</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Time (sec)</label>
                            <input type="number" step="0.01" name="execution_time" class="form-control" placeholder="0.00">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Qualitative Rating</label>
                        <select name="rating" class="form-select" required>
                            <option value="5" selected> 5 - Perfect execution</option>
                            <option value="4"> 4 - Minor display/text issue</option>
                            <option value="3"> 3 - Executed the wrong action</option>
                            <option value="2"> 2 - Hallucinated completely</option>
                            <option value="1"> 1 - Fatal crash</option>
                        </select>
                    </div>
                    
                    <div class="mb-5">
                        <label class="form-label">Tester Notes</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="Any weird behavior or observations?"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-brand w-100 py-2 rounded-3">Push to Supabase 🚀</button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS for dismissible alerts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
